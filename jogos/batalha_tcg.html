<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Simulador TCG - for_code</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a1a; color: white; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { background: #2a2a2a; padding: 25px; border-radius: 15px; width: 450px; box-shadow: 0 10px 30px rgba(0,0,0,0.7); border: 1px solid #444; }
        h2 { color: #e74c3c; text-align: center; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; border-bottom: 1px dashed #555; padding-bottom: 10px; }
        label { display: block; font-size: 0.9em; color: #bbb; }
        input { width: 95%; margin: 5px 0; padding: 10px; border-radius: 5px; border: 1px solid #444; background: #111; color: #fff; }
        button { background: #e74c3c; color: white; border: none; padding: 12px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; font-size: 1em; transition: 0.3s; }
        button:hover { background: #c0392b; transform: scale(1.02); }
        .log { margin-top: 20px; background: #000; padding: 15px; border-radius: 8px; height: 350px; overflow-y: auto; font-family: 'Courier New', monospace; font-size: 14px; border: 1px solid #e74c3c; }
        .turno-header { color: #f1c40f; margin-top: 10px; border-bottom: 1px solid #333; }
        .status-hp { color: #2ecc71; font-weight: bold; }
        .winner-box { background: #f1c40f; color: #000; padding: 10px; border-radius: 5px; text-align: center; font-weight: bold; margin-top: 15px; font-size: 1.2em; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body>
    <h2>⚔️ TCG Batalha de Cartas - Simulador</h2>

    <div id="config-area" class="container">
        <div class="input-group">
            <label>MONSTRO 1 (Ataca Primeiro)</label>
            <input type="text" id="n1" placeholder="Nome" value="Dragão">
            <input type="number" id="h1" placeholder="HP" value="2000">
            <input type="number" id="a1" placeholder="Ataque" value="1700">
        </div>
        <div class="input-group">
            <label>MONSTRO 2</label>
            <input type="text" id="n2" placeholder="Nome" value="Negro">
            <input type="number" id="h2" placeholder="HP" value="3000">
            <input type="number" id="a2" placeholder="Ataque" value="1800">
        </div>
        <button onclick="iniciarDuelo()">🔥 INICIAR BATALHA</button>
    </div>

    <div id="battle-area" class="container" style="display:none;">
        <div id="log" class="log"></div>
        <button onclick="location.reload()" style="margin-top:15px; background: #3498db;">🔄 NOVO DUELO</button>
    </div>

    <script>
        function iniciarDuelo() {
            let m1 = { nome: document.getElementById('n1').value, hp: parseInt(document.getElementById('h1').value), atk: parseInt(document.getElementById('a1').value) };
            let m2 = { nome: document.getElementById('n2').value, hp: parseInt(document.getElementById('h2').value), atk: parseInt(document.getElementById('a2').value) };

            if (m1.hp <= 0 || m1.atk <= 0 || m2.hp <= 0 || m2.atk <= 0) {
                alert("Por favor, insira valores maiores que zero!"); return;
            }

            document.getElementById('config-area').style.display = 'none';
            document.getElementById('battle-area').style.display = 'block';
            
            const log = document.getElementById('log');
            let turno = 1;

            while (m1.hp > 0 && m2.hp > 0) {
                log.innerHTML += `<div class="turno-header">--- TURNO ${turno} ---</div>`;
                
                // Ataque do Monstro 1
                m2.hp -= m1.atk;
                if (m2.hp < 0) m2.hp = 0;
                log.innerHTML += `<div>💥 <strong>${m1.nome}</strong> atacou causando ${m1.atk} de dano!</div>`;
                
                if (m2.hp > 0) {
                    // Contra-ataque do Monstro 2
                    m1.hp -= m2.atk;
                    if (m1.hp < 0) m1.hp = 0;
                    log.innerHTML += `<div>💥 <strong>${m2.nome}</strong> revidou causando ${m2.atk} de dano!</div>`;
                }

                log.innerHTML += `<div class="status-hp">📊 HP: ${m1.nome} (${m1.hp}) | ${m2.nome} (${m2.hp})</div><br>`;
                turno++;
            }

            let vencedor = m1.hp > 0 ? m1.nome : m2.nome;
            log.innerHTML += `<div class="winner-box">🏆 VITORIOSO: ${vencedor.toUpperCase()}!</div>`;
            log.scrollTop = log.scrollHeight; // Auto-scroll para o final
        }
    </script>
</body>
</html>
